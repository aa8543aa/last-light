<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Forest Render Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  #fps { position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%); color: #fff; font: 11px monospace; opacity: .35; }
  #hud {
    --ink: #f2f5fb; --dim: rgba(226,233,247,.62); --line: rgba(226,233,247,.26);
    --hp: #f4efe6; --warn: #e2604c; --warm: #ffc27a;
    position: fixed; inset: 0; pointer-events: none; color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.75);
    padding: clamp(14px, 2.6vw, 34px); box-sizing: border-box;
    display: grid; grid-template: auto 1fr auto / 1fr minmax(0, 2fr) 1fr; gap: 12px;
  }
  .label { font-size: 11px; letter-spacing: .08em; color: var(--dim); }
  .big { font-size: clamp(20px, 2.4vw, 30px); font-weight: 300; line-height: 1.15; }
  .unit { font-size: .55em; color: var(--dim); margin-left: 2px; }
  #hp { width: min(100%, 220px); }
  .hp-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .hp-bar { height: 4px; background: var(--line); }
  .hp-bar i { display: block; height: 100%; width: 72%; background: var(--hp); box-shadow: 0 0 8px rgba(244,239,230,.45); }
  #route { justify-self: center; width: min(100%, 460px); text-align: center; }
  .track { position: relative; height: 1px; margin: 12px 0 7px; background: var(--line); }
  .track .done { position: absolute; inset: 0 auto 0 0; width: 33%; background: var(--ink); }
  .track .me { position: absolute; left: 33%; top: -4px; width: 7px; height: 7px; margin-left: -4px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 6px rgba(255,255,255,.8); }
  .track .home { position: absolute; right: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 10px 3px rgba(255,170,90,.75); }
  .ends { display: flex; justify-content: space-between; }
  #stats { justify-self: end; display: flex; gap: clamp(14px, 2vw, 26px); text-align: right; }
  #axe { grid-row: 3; grid-column: 1; align-self: end; display: flex; align-items: center; gap: 10px; }
  #axe svg { width: 34px; height: 34px; }
  .pips { display: flex; gap: 3px; margin-top: 5px; }
  .pips i { width: 16px; height: 4px; background: var(--ink); }
  .pips i.off { background: var(--line); }
  #keys { grid-row: 3; grid-column: 3; align-self: end; justify-self: end; display: flex; gap: 14px; font-size: 12px; color: var(--dim); }
  kbd { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; margin-right: 4px; background: rgba(5,10,20,.3); }
  @media (max-width: 640px) {
    #hud { grid-template: auto auto 1fr auto / 1fr 1fr; }
    #route { grid-column: 1 / -1; grid-row: 2; width: 100%; }
    #stats { grid-column: 2; grid-row: 1; }
    #axe { grid-row: 4; }
    #keys { grid-row: 4; grid-column: 2; flex-direction: column; align-items: flex-end; gap: 6px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <section id="hp" aria-label="체력">
    <div class="hp-row"><span class="label">체력</span><span class="big">72</span></div>
    <div class="hp-bar"><i></i></div>
  </section>
  <section id="route" aria-label="진행도">
    <div class="big">2.4<span class="unit">km</span></div>
    <div class="label">민가까지 남은 거리</div>
    <div class="track"><div class="done"></div><div class="me"></div><div class="home"></div></div>
    <div class="ends label"><span>추락 지점</span><span>민가</span></div>
  </section>
  <section id="stats" aria-label="기록">
    <div><div class="label">시간</div><div class="big">01:36</div></div>
    <div><div class="label">코인</div><div class="big">24</div></div>
    <div><div class="label">점수</div><div class="big">3,480</div></div>
  </section>
  <section id="axe" aria-label="무기">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 12 25 28"/><path d="M8 4c5 0 10 2 12 6-3 1-5 3-6 6C9 15 6 10 8 4Z" fill="currentColor" fill-opacity=".85"/>
    </svg>
    <div><div class="label">도끼</div><div class="pips"><i></i><i></i><i class="off"></i></div></div>
  </section>
  <section id="keys" aria-label="조작법">
    <span><kbd>A</kbd><kbd>D</kbd>좌우 이동</span>
    <span><kbd>Space</kbd>도끼 휘두르기</span>
  </section>
</div>
<div id="fps"></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js"></script>
<script>
const B = BABYLON;

// 항상 같은 장면이 나오도록 고정 시드 난수를 사용한다.
let seed = 20261225;
const rnd = (a = 0, b = 1) => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return a + (seed / 4294967296) * (b - a);
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (x, y) => {
  const i = Math.floor(x), j = Math.floor(y), f = x - i, g = y - j;
  const u = f * f * (3 - 2 * f), v = g * g * (3 - 2 * g);
  return (hash(i, j) * (1 - u) + hash(i + 1, j) * u) * (1 - v)
       + (hash(i, j + 1) * (1 - u) + hash(i + 1, j + 1) * u) * v;
};
const fbm = (x, y) => noise(x, y) * .5 + noise(x * 2.1, y * 2.1) * .3 + noise(x * 4.3, y * 4.3) * .2;

const pathX = z => 7 * Math.sin(z * .028) + 2 * Math.sin(z * .07);
const groundY = (x, z) => {
  const d = Math.abs(x - pathX(z));
  return smooth(2.6, 9, d) * (1.1 + d * .05) + (fbm(x * .12, z * .12) - .5) * (.25 + smooth(3, 12, d) * 2.2) - z * .035;
};

const VILLAGE_Z = 170, VILLAGE_X = pathX(170);
const canvas = document.getElementById('c');
const engine = new B.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
const scene = new B.Scene(engine);
scene.clearColor = new B.Color4(.012, .02, .04, 1);
scene.fogMode = B.Scene.FOGMODE_EXP2;
scene.fogColor = new B.Color3(.028, .045, .08);
scene.fogDensity = .013;

const camY = groundY(pathX(0), 0) + 1.3;
const camera = new B.UniversalCamera('cam', new B.Vector3(pathX(0), camY, 0), scene);
camera.setTarget(new B.Vector3(VILLAGE_X * .1 + pathX(0) * .9, camY + 1.2, 17));
camera.fov = 1.0;
camera.minZ = .1;
camera.maxZ = 900;
camera.attachControl(canvas, true);

// 조명: 달빛, 하늘빛, 플레이어 앞의 약한 랜턴 빛
const moon = new B.DirectionalLight('moon', new B.Vector3(.55, -.7, -.45).normalize(), scene);
moon.diffuse = new B.Color3(.62, .74, 1);
moon.intensity = 1.5;
const hemi = new B.HemisphericLight('hemi', new B.Vector3(0, 1, 0), scene);
hemi.diffuse = new B.Color3(.2, .3, .52);
hemi.groundColor = new B.Color3(.08, .11, .2);
hemi.specular = new B.Color3(0, 0, 0);
hemi.intensity = .55;
const lantern = new B.SpotLight('lantern', camera.position.add(new B.Vector3(.3, -.2, 0)),
  new B.Vector3(0, -.2, 1).normalize(), 1.1, 3, scene);
lantern.diffuse = new B.Color3(1, .74, .46);
lantern.intensity = 16;
lantern.range = 28;

const shadow = new B.CascadedShadowGenerator(2048, moon);
shadow.shadowMaxZ = 90;
shadow.numCascades = 3;
shadow.usePercentageCloserFiltering = true;
shadow.lambda = .85;
shadow.bias = .004;
shadow.setDarkness(.42);

// 눈 표면의 미세한 굴곡을 위한 노멀맵을 코드로 만든다.
const normalTex = (() => {
  const size = 1024, tex = new B.DynamicTexture('snowN', size, scene, true);
  const ctx = tex.getContext(), img = ctx.createImageData(size, size);
  const h = (x, y) => fbm(x * .02, y * .02) * 1.3 + fbm(x * .11, y * .11) * .35 + hash(x, y) * .025;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (h(x + 1, y) - h(x - 1, y)) * 3, dy = (h(x, y + 1) - h(x, y - 1)) * 3;
    const l = Math.hypot(dx, dy, 1), i = (y * size + x) * 4;
    img.data[i] = (-dx / l * .5 + .5) * 255;
    img.data[i + 1] = (-dy / l * .5 + .5) * 255;
    img.data[i + 2] = (1 / l * .5 + .5) * 255;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  tex.update(false);
  tex.uScale = tex.vScale = 34;
  return tex;
})();

const lit = (name, r, g, b, rough) => {
  const m = new B.PBRMaterial(name, scene);
  m.albedoColor = new B.Color3(r, g, b);
  m.metallic = 0;
  m.roughness = rough;
  m.maxSimultaneousLights = 4;
  return m;
};

// 지면
const ground = B.MeshBuilder.CreateGround('ground',
  { width: 150, height: 340, subdivisionsX: 300, subdivisionsY: 680, updatable: true }, scene);
ground.position.z = 150;
{
  const p = ground.getVerticesData('position'), n = [], idx = ground.getIndices();
  for (let i = 0; i < p.length; i += 3) p[i + 1] = groundY(p[i], p[i + 2] + 150);
  B.VertexData.ComputeNormals(p, idx, n);
  ground.updateVerticesData('position', p);
  ground.updateVerticesData('normal', n);
  ground.refreshBoundingInfo();
}
const snow = lit('snow', .84, .89, .98, .62);
snow.bumpTexture = normalTex;
snow.invertNormalMapX = snow.invertNormalMapY = false;
ground.material = snow;
ground.receiveShadows = true;

// 재귀 가지 생성기: 위쪽은 상고대, 아래쪽과 굵은 줄기는 어두운 나무껍질 색이다.
function buildPlant(opts) {
  const pos = [], nor = [], col = [], ind = [];
  const tube = (a, b, ra, rb, sides, snowAmt) => {
    const d = b.subtract(a).normalize();
    const u = B.Vector3.Cross(d, Math.abs(d.y) > .9 ? B.Axis.X : B.Axis.Y).normalize();
    const v = B.Vector3.Cross(d, u);
    const base = pos.length / 3;
    for (let ring = 0; ring < 2; ring++) {
      const c = ring ? b : a, r = ring ? rb : ra;
      for (let s = 0; s < sides; s++) {
        const t = s / sides * Math.PI * 2;
        const nx = u.x * Math.cos(t) + v.x * Math.sin(t);
        const ny = u.y * Math.cos(t) + v.y * Math.sin(t);
        const nz = u.z * Math.cos(t) + v.z * Math.sin(t);
        pos.push(c.x + nx * r, c.y + ny * r, c.z + nz * r);
        nor.push(nx, ny, nz);
        const w = clamp(snowAmt + ny * .75 + rnd(-.12, .12), 0, 1);
        col.push(.035 + w * .86, .032 + w * .9, .034 + w * .96, 1);
      }
    }
    for (let s = 0; s < sides; s++) {
      const n = (s + 1) % sides;
      ind.push(base + s, base + sides + s, base + n, base + n, base + sides + s, base + sides + n);
    }
  };
  const grow = (p, d, len, r, depth) => {
    const end = p.add(d.scale(len));
    tube(p, end, r, r * .68, depth > 3 ? 6 : depth > 1 ? 4 : 3, depth >= opts.barkDepth ? .1 : .55 + (opts.barkDepth - depth) * .12);
    if (depth <= 2) for (let i = 0; i < opts.needles; i++) {
      // 상고대 결정: 가지에서 바람 방향으로 뻗는 흰 침상 구조
      const a = p.add(d.scale(rnd(0, len)));
      const nd = new B.Vector3(rnd(-1, 1), rnd(-.2, 1), rnd(-1, 1)).normalize();
      tube(a, a.add(nd.scale(rnd(.025, .075))), rnd(.005, .01), .002, 3, 1);
    }
    if (depth === 0) return;
    const kids = depth > opts.depth - 2 ? 2 + Math.round(rnd()) : 3;
    for (let i = 0; i < kids; i++) {
      const nd = d.add(new B.Vector3(rnd(-1, 1), rnd(-.35, .55), rnd(-1, 1)).scale(opts.spread)).normalize();
      grow(p.add(d.scale(len * rnd(.5, 1))), nd, len * rnd(.62, .82), Math.max(r * .62, .006), depth - 1);
    }
    grow(end, d.add(new B.Vector3(rnd(-.3, .3), .05, rnd(-.3, .3))).normalize(), len * .78, r * .68, depth - 1);
  };
  for (let i = 0; i < opts.stems; i++) {
    const a = rnd(0, 6.28), off = opts.stems > 1 ? rnd(.1, .5) : 0;
    grow(new B.Vector3(Math.cos(a) * off, -.2, Math.sin(a) * off),
      new B.Vector3(Math.cos(a) * opts.lean, 1, Math.sin(a) * opts.lean).normalize(),
      opts.len, opts.radius, opts.depth);
  }
  const m = new B.Mesh(opts.name, scene), vd = new B.VertexData();
  vd.positions = pos; vd.normals = nor; vd.colors = col; vd.indices = ind;
  vd.applyToMesh(m);
  return m;
}

const plantMat = lit('rime', 1, 1, 1, .78);
plantMat.backFaceCulling = false;

const scatter = (mesh, items) => {
  const buf = new Float32Array(items.length * 16);
  items.forEach((it, i) => B.Matrix.Compose(new B.Vector3(it.s, it.s * rnd(.9, 1.15), it.s),
    B.Quaternion.RotationAxis(B.Axis.Y, rnd(0, 6.28)), new B.Vector3(it.x, it.y, it.z)).copyToArray(buf, i * 16));
  mesh.thinInstanceSetBuffer('matrix', buf, 16, true);
  mesh.alwaysSelectAsActiveMesh = true;
  mesh.material = plantMat;
  mesh.receiveShadows = true;
};

const place = (count, zMin, zMax, dMin, dMax, sMin, sMax) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    const z = rnd(zMin, zMax), side = rnd() < .5 ? -1 : 1, d = rnd(dMin, dMax), x = pathX(z) + side * d;
    const lineX = pathX(0) + (VILLAGE_X - pathX(0)) * z / VILLAGE_Z;
    if (z > 12 && z < VILLAGE_Z + 20 && Math.abs(x - lineX) < 3.5 + z * .06) continue;
    out.push({ x, z, y: groundY(x, z) - .1, s: rnd(sMin, sMax) });
  }
  return out;
};

const heroTree = buildPlant({ name: 'hero', depth: 6, stems: 3, len: 2.5, radius: .13, spread: .62, lean: .22, barkDepth: 5, needles: 9 });
const farTree = buildPlant({ name: 'far', depth: 4, stems: 3, len: 3, radius: .17, spread: .72, lean: .22, barkDepth: 4, needles: 0 });
const shrub = buildPlant({ name: 'shrub', depth: 5, stems: 7, len: .72, radius: .022, spread: .8, lean: .55, barkDepth: 5, needles: 9 });

scatter(heroTree, place(70, -6, 60, 6, 20, .9, 1.35));
scatter(farTree, place(900, 30, 300, 7, 72, .9, 1.5).concat(place(160, -10, 30, 20, 72, 1, 1.5)));
scatter(shrub, place(280, -6, 110, 3.4, 8, .8, 1.5));
shadow.addShadowCaster(heroTree);
shadow.addShadowCaster(shrub);
shadow.addShadowCaster(farTree);

// 울타리: 어두운 기둥과 위에 눈이 쌓인 난간
const postMat = lit('post', .03, .028, .03, .55);
const railSnow = lit('railSnow', .88, .92, 1, .8);
const addBetween = (a, b, r, mat) => {
  const t = B.MeshBuilder.CreateTube('t', { path: [a, b], radius: r, tessellation: 8, cap: B.Mesh.CAP_ALL }, scene);
  t.material = mat; t.receiveShadows = true; shadow.addShadowCaster(t);
  return t;
};
for (const side of [-1, 1]) {
  let prev = null;
  for (let z = 1.5; z < 60; z += 3.2) {
    const x = pathX(z) + side * 2.9, y = groundY(x, z);
    const top = new B.Vector3(x, y + 1.05, z), mid = new B.Vector3(x, y + .55, z);
    addBetween(new B.Vector3(x, y - .2, z), top.add(new B.Vector3(0, .1, 0)), .065, postMat);
    addBetween(top.add(new B.Vector3(0, .11, 0)), top.add(new B.Vector3(0, .17, 0)), .07, railSnow);
    if (prev) {
      addBetween(prev.top, top, .032, postMat);
      addBetween(prev.mid, mid, .028, postMat);
      addBetween(prev.top.add(new B.Vector3(0, .03, 0)), top.add(new B.Vector3(0, .03, 0)), .03, railSnow);
    }
    prev = { top, mid };
  }
}

// 먼 하늘, 달, 설산 능선을 한 장의 배경으로 그린다.
{
  const W = 2048, H = 1024, tex = new B.DynamicTexture('sky', { width: W, height: H }, scene, true);
  const c = tex.getContext();
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#030712'); g.addColorStop(.55, '#0b1730'); g.addColorStop(.72, '#1b2d50'); g.addColorStop(1, '#101c33');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 1500; i++) {
    c.globalAlpha = rnd(.08, .8) ** 2;
    c.fillStyle = rnd() < .2 ? '#cfe0ff' : '#fff';
    const r = rnd(.35, 1.15);
    c.beginPath(); c.arc(rnd(0, W), rnd(0, H * .6), r, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  const mx = 1290, my = 300, halo = c.createRadialGradient(mx, my, 8, mx, my, 280);
  halo.addColorStop(0, 'rgba(190,212,255,.6)'); halo.addColorStop(.12, 'rgba(130,165,235,.2)'); halo.addColorStop(1, 'rgba(90,130,210,0)');
  c.fillStyle = halo; c.fillRect(0, 0, W, H);
  c.fillStyle = '#eef3ff'; c.beginPath(); c.arc(mx, my, 24, 0, 7); c.fill();
  // 능선 2겹: 위는 달빛을 받은 눈, 아래는 그늘
  for (const [base, amp, top, bot, f] of [[520, 120, '#9fb4dc', '#1a2846', .0042], [590, 80, '#566d9c', '#101a30', .007]]) {
    const pts = [];
    for (let x = 0; x <= W; x += 4) {
      const ridge = 1 - Math.abs(fbm(x * f, base * .01) * 2 - 1);
      pts.push([x, base - ridge * ridge * amp * 2 + fbm(x * .05, 9) * 24]);
    }
    const gr = c.createLinearGradient(0, base - amp * 2, 0, H);
    gr.addColorStop(0, top); gr.addColorStop(.5, bot); gr.addColorStop(1, bot);
    c.fillStyle = gr;
    c.beginPath(); c.moveTo(0, H);
    pts.forEach(p => c.lineTo(p[0], p[1]));
    c.lineTo(W, H); c.fill();
  }
  tex.update(false);
  const m = new B.StandardMaterial('skyM', scene);
  m.emissiveTexture = tex; m.disableLighting = true; m.fogEnabled = false; m.backFaceCulling = false;
  m.emissiveTexture.level = 1;
  const sky = B.MeshBuilder.CreatePlane('sky', { width: 1500, height: 750 }, scene);
  sky.position.set(camera.position.x, 90, 560);
  sky.material = m;
  sky.applyFog = false;
}

// 멀리 보이는 민가 불빛
{
  const size = 256, tex = new B.DynamicTexture('glow', size, scene, true), c = tex.getContext();
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,214,150,1)'); g.addColorStop(.18, 'rgba(255,160,80,.42)'); g.addColorStop(1, 'rgba(255,120,40,0)');
  c.fillStyle = g; c.fillRect(0, 0, size, size); tex.update(false); tex.hasAlpha = true;
  const m = new B.StandardMaterial('glowM', scene);
  m.emissiveTexture = tex; m.opacityTexture = tex; m.disableLighting = true; m.fogEnabled = false;
  m.alphaMode = B.Engine.ALPHA_ADD; m.backFaceCulling = false;
  [[0, 0, 26], [-7, 1, 9], [6, -.6, 11]].forEach(([dx, dy, s], i) => {
    const z = VILLAGE_Z, x = VILLAGE_X + dx, gl = B.MeshBuilder.CreatePlane('g' + i, { size: s }, scene);
    gl.position.set(x, camY + 3.2 + dy, z);
    gl.billboardMode = B.Mesh.BILLBOARDMODE_ALL;
    gl.material = m;
  });
}

// 내리는 눈
{
  const size = 64, tex = new B.DynamicTexture('flake', size, scene, true), c = tex.getContext();
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, size, size); tex.update(false); tex.hasAlpha = true;
  const ps = new B.ParticleSystem('snowfall', 3500, scene);
  ps.particleTexture = tex;
  ps.emitter = camera.position.add(new B.Vector3(0, 9, 12));
  ps.minEmitBox = new B.Vector3(-22, 0, -14);
  ps.maxEmitBox = new B.Vector3(22, 2, 26);
  ps.color1 = new B.Color4(.8, .87, 1, .75); ps.color2 = new B.Color4(.65, .75, 1, .4); ps.colorDead = new B.Color4(.6, .7, 1, 0);
  ps.minSize = .018; ps.maxSize = .06; ps.minLifeTime = 5; ps.maxLifeTime = 10; ps.emitRate = 450;
  ps.gravity = new B.Vector3(.12, -.75, -.05);
  ps.direction1 = new B.Vector3(-.15, -.4, -.15); ps.direction2 = new B.Vector3(.2, -.6, .15);
  ps.blendMode = B.ParticleSystem.BLENDMODE_ADD;
  ps.preWarmCycles = 600; ps.preWarmStepOffset = 4;
  ps.start();
}

// 후처리
const pipe = new B.DefaultRenderingPipeline('pipe', true, scene, [camera]);
pipe.samples = 4;
pipe.fxaaEnabled = true;
pipe.bloomEnabled = true; pipe.bloomThreshold = .72; pipe.bloomWeight = .45; pipe.bloomKernel = 72; pipe.bloomScale = .5;
pipe.grainEnabled = true; pipe.grain.intensity = 6; pipe.grain.animated = true;
const ip = pipe.imageProcessing;
ip.toneMappingEnabled = true; ip.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
ip.exposure = 1.3; ip.contrast = 1.25;
ip.vignetteEnabled = true; ip.vignetteWeight = 1.6; ip.vignetteColor = new B.Color4(0, 0, 0, 0); ip.vignetteCameraFov = 1;

const ssao = new B.SSAO2RenderingPipeline('ssao', scene, { ssaoRatio: .5, blurRatio: 1 }, [camera]);
ssao.radius = 1.4; ssao.totalStrength = 1.15; ssao.samples = 16; ssao.maxZ = 120; ssao.minZAspect = .3;

const fps = document.getElementById('fps');
let frames = 0;
engine.runRenderLoop(() => {
  scene.render();
  if (++frames % 20 === 0) fps.textContent = `${engine.getFps().toFixed(0)} FPS | ${scene.getTotalVertices().toLocaleString()} verts`;
  if (frames === 60) window.__ready = true;
});
addEventListener('resize', () => engine.resize());
</script>
